<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prova Interativa - Redes de Computadores</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root { 
            --primary: #3b82f6; 
            --secondary: #1e293b; 
            --bg: #f8fafc; 
            --text: #0f172a; 
            --success: #10b981; 
            --error: #ef4444;
            --accent: #059669;
            --warning: #f59e0b;
            --border: #e2e8f0;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            padding: 16px; 
            line-height: 1.6; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container { 
            width: 100%;
            max-width: 680px; 
            background: var(--card-bg); 
            padding: 24px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05); 
            border: 1px solid var(--border);
        }

        .header { 
            text-align: center; 
            margin-bottom: 24px; 
            border-bottom: 2px solid var(--border); 
            padding-bottom: 20px; 
        }
        .header h1 { 
            color: var(--secondary); 
            margin: 0; 
            font-size: 22px; 
            font-weight: 700;
            letter-spacing: -0.025em;
        }
        .header p { 
            color: var(--accent); 
            font-weight: 600; 
            margin: 6px 0 0 0; 
            font-size: 14px;
        }
        
        .progress-bar {
            height: 8px;
            background: var(--border);
            border-radius: 9999px;
            margin-bottom: 24px;
            overflow: hidden;
        }
        #progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .identification { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 16px; 
            margin-bottom: 24px; 
            background: #f1f5f9; 
            padding: 20px; 
            border-radius: 12px;
        }
        .form-group { 
            display: flex; 
            flex-direction: column; 
        }
        .form-group label { 
            font-size: 13px; 
            font-weight: 600; 
            margin-bottom: 6px; 
            color: var(--secondary);
        }
        .form-group input, 
        .form-group select { 
            padding: 12px; 
            border: 1.5px solid var(--border); 
            border-radius: 8px; 
            font-size: 15px; 
            font-family: inherit;
            color: var(--text);
            background-color: white;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            width: 100%;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .grid-span-2 {
            grid-column: 1 / -1;
        }

        #quiz-engine { display: none; }
        .question-card { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(8px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .question-text { 
            font-size: 16px; 
            font-weight: 600; 
            margin-bottom: 20px; 
            display: block; 
            color: var(--secondary);
            line-height: 1.5;
        }
        .answers { list-style: none; padding: 0; margin-bottom: 24px; }
        .answers li { margin-bottom: 10px; }
        
        .answer-label { 
            display: flex; 
            align-items: center; 
            cursor: pointer; 
            padding: 14px 16px; 
            border: 1.5px solid var(--border);
            border-radius: 10px; 
            transition: all 0.2s ease;
            background: white;
        }
        .answer-label:hover { 
            background: #f8fafc; 
            border-color: var(--primary); 
        }
        input[type="radio"] { 
            margin-right: 12px; 
            width: 20px; 
            height: 20px; 
            cursor: pointer; 
            accent-color: var(--primary);
            flex-shrink: 0;
        }
        
        input[type="radio"]:checked + span { 
            font-weight: 600; 
            color: var(--primary); 
        }
        .answer-label.selected { 
            border-color: var(--primary); 
            background: #eff6ff; 
            box-shadow: 0 0 0 1px var(--primary);
        }

        .actions { 
            display: flex; 
            flex-direction: column;
            gap: 12px; 
        }
        
        button { 
            border: none; 
            padding: 14px 24px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 15px; 
            font-family: inherit;
            transition: all 0.2s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-check { background: var(--secondary); color: white; }
        .btn-next { background: var(--success); color: white; display: none; }
        .btn-start { background: var(--accent); color: white; margin-top: 10px; }
        
        button:hover { 
            filter: brightness(1.05);
            transform: translateY(-1px); 
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled { 
            background: #cbd5e1; 
            color: #64748b;
            cursor: not-allowed; 
            transform: none; 
            filter: none;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.60);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
            animation: modalIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes modalIn { 
            from { transform: scale(0.95); opacity: 0; } 
            to { transform: scale(1); opacity: 1; } 
        }

        .modal-status { font-size: 20px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.01em; }
        .status-success { color: var(--success); }
        .status-error { color: var(--error); }
        .modal-theory { 
            background: #f8fafc; 
            padding: 16px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            text-align: left; 
            font-size: 14px; 
            border-left: 4px solid var(--primary); 
            max-height: 250px;
            overflow-y: auto;
            color: #475569;
        }
        .btn-close-modal { background: var(--primary); color: white; }

        #success-screen { display: none; text-align: center; padding: 24px 8px; }
        .score-box { font-size: 44px; font-weight: 800; color: var(--accent); margin: 16px 0; }
        
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            color: var(--secondary);
            font-size: 16px;
        }

        /* Desktop specific styling overrides using media queries */
        @media (min-width: 768px) {
            body {
                padding: 40px 20px;
            }
            .container {
                padding: 40px;
            }
            .header h1 {
                font-size: 26px;
            }
            .identification { 
                grid-template-columns: 1fr 1fr; 
                gap: 20px; 
                padding: 24px;
            }
            .actions { 
                flex-direction: row; 
                gap: 16px; 
            }
            .actions button {
                flex: 1;
            }
            .question-text {
                font-size: 18px;
            }
            #success-screen {
                padding: 40px;
            }
            .modal-content {
                padding: 32px;
            }
        }
    </style>
</head>
<body>

<div id="loading" class="loading-overlay">Carregando questões...</div>

<div class="container">
    <div id="setup-screen">
    <div class="header">
        <h1>Prova de Conhecimentos</h1>
        <p>Redes de Computadores e Segurança na Nuvem</p>
    </div>
    <div class="identification">
        <!-- Campos de Texto -->
        <div class="form-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" placeholder="Seu nome" required>
        </div>
        <div class="form-group">
            <label for="ra">RA</label>
            <input type="text" id="ra" placeholder="Seu RA" required>
        </div>

        <!-- Picklists -->
        <div class="form-group">
            <label for="escola">Escola</label>
            <select id="escola" required>
                <option value="">Selecione...</option>
                <option value="Antonio Reginato">Antonio Reginato</option>
                <option value="Amilcate Mattei">Amilcate Mattei</option>
                <option value="Monsenhor Bicudo">Monsenhor Bicudo</option>
            </select>
        </div>
        <div class="form-group">
            <label for="serie">Série</label>
            <select id="serie" required>
                <option value="">Selecione...</option>
                <option value="2A">2A</option>
                <option value="2B">2B</option>
                <option value="3A">3A</option>
                <option value="3B">3B</option>
            </select>
        </div>
        <div class="form-group grid-span-2">
            <label for="disciplina">Disciplina</label>
            <select id="disciplina" required>
                <option value="">Selecione a disciplina...</option>
                <option value="Lógica e Linguagem de Programação">Lógica e Linguagem de Programação</option>
                <option value="Redes de Computadores e Segurança na Nuvem">Redes de Computadores e Segurança na Nuvem</option>
                <option value="Processos de Desenvolvimento de Software e Metodologias ágeis">Processos de Desenvolvimento de Software e Metodologias ágeis</option>
                <option value="Carreira e Competências para o Mercado de Trabalho">Carreira e Competências para o Mercado de Trabalho</option>
                <option value="Versionamento de Código e Sistemas de Mensageria">Versionamento de Código e Sistemas de Mensageria</option>
                <option value="Inteligência Artificial">Inteligência Artificial</option>
                <option value="Programação Mobile">Programação Mobile</option>
                <option value="Programação Back-End">Programação Back-End</option>
                <option value="Programação Front-End">Programação Front-End</option>
                <option value="Modelagem e Desenvolvimento de Banco de Dados">Modelagem e Desenvolvimento de Banco de Dados</option>
                <option value="Projeto Multidisciplinar">Projeto Multidisciplinar</option>
            </select>
        </div>
        <div class="form-group grid-span-2">
            <label for="professor">Professor</label>
            <select id="professor" required>
                <option value="">Selecione...</option>
                <option value="Adriano Justino Rosa">Adriano Justino Rosa</option>
                <option value="Eduardo Lazaro">Eduardo Lazaro</option>
            </select>
        </div>
    </div>
    <button class="btn-start" id="btn-start" onclick="startQuiz()">INICIAR AVALIAÇÃO</button>
</div>

    <div id="quiz-engine">
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <div id="question-container"></div>
    </div>

    <div id="success-screen">
        <div style="font-size: 60px; color: var(--success);">✓</div>
        <h2>Avaliação Finalizada!</h2>
        <p>Sua pontuação final foi:</p>
        <div class="score-box" id="final-score">0.0</div>
        <p id="msg-sucesso"></p>
        <button id="btn-enviar" class="btn-start" onclick="enviarDados()">ENVIAR AVALIAÇÃO</button>
    </div>
</div>

<div id="feedbackModal" class="modal">
    <div class="modal-content">
        <div id="modal-status" class="modal-status"></div>
        <div class="modal-theory" id="modal-theory"></div>
        <button class="btn-close-modal" id="btnCloseModal">ENTENDI</button>
    </div>
</div>

<script>
    let questions = [];
    let currentQuestionIndex = 0;
    let totalScore = 0;
    let attemptsOnCurrentQuestion = 0;
    let userData = {};
    let userAnswers = {}; // Armazena as respostas q1, q2...
    let countdownInterval = null;

    function startFeedbackTimer() {
        const btnClose = document.getElementById('btnCloseModal');
        btnClose.disabled = true;
        let secondsRemaining = 120;

        const formatTime = (secs) => {
            const m = Math.floor(secs / 60);
            const s = secs % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        };

        btnClose.innerText = `ENTENDI (Aguarde ${formatTime(secondsRemaining)})`;

        if (countdownInterval) clearInterval(countdownInterval);

        countdownInterval = setInterval(() => {
            secondsRemaining--;
            if (secondsRemaining <= 0) {
                clearInterval(countdownInterval);
                countdownInterval = null;
                btnClose.disabled = false;
                btnClose.innerText = "ENTENDI";
            } else {
                btnClose.innerText = `ENTENDI (Aguarde ${formatTime(secondsRemaining)})`;
            }
        }, 1000);
    }

    function resetFeedbackButton() {
        if (countdownInterval) {
            clearInterval(countdownInterval);
            countdownInterval = null;
        }
        const btnClose = document.getElementById('btnCloseModal');
        btnClose.disabled = false;
        btnClose.innerText = "ENTENDI";
    }

    // Mapeamento das disciplinas para os respectivos arquivos JSON
    function getJsonFileName(disciplina) {
        switch (disciplina) {
            case "Lógica e Linguagem de Programação":
                return "logica.json";
            case "Redes de Computadores e Segurança na Nuvem":
                return "redes.json";
            case "Processos de Desenvolvimento de Software e Metodologias ágeis":
                return "processos.json";
            case "Carreira e Competências para o Mercado de Trabalho":
                return "carreira.json";
            case "Versionamento de Código e Sistemas de Mensageria":
                return "versionamento.json";
            case "Inteligência Artificial":
                return "ia.json";
            case "Programação Mobile":
                return "mobile.json";
            case "Programação Back-End":
                return "backend.json";
            case "Programação Front-End":
                return "frontend.json";
            case "Modelagem e Desenvolvimento de Banco de Dados":
                return "banco_dados.json";
            case "Projeto Multidisciplinar":
                return "projeto.json";
            default:
                return "dados.json";
        }
    }

    // Função para carregar as questões do arquivo JSON correspondente
    async function loadQuestions(disciplina) {
        const loading = document.getElementById('loading');
        loading.style.display = 'flex';
        loading.innerText = 'Carregando questões da disciplina...';
        
        const jsonFile = getJsonFileName(disciplina);
        
        try {
            let response = await fetch(jsonFile);
            
            // Fallback para dados.json caso o redes.json falhe ou não exista (para compatibilidade local)
            if (!response.ok) {
                if (jsonFile === 'redes.json') {
                    console.log('redes.json não encontrado, tentando dados.json...');
                    response = await fetch('dados.json');
                }
                
                if (!response || !response.ok) {
                    throw new Error(`Falha ao carregar o arquivo ${jsonFile}`);
                }
            }
            
            const rawData = await response.json();
            
            questions = rawData.map(item => {
                let corretaStr = (item.CORRETA || "").trim().toLowerCase();
                
                // 1. Check if it's prefixed with 'alt_'
                if (corretaStr.startsWith("alt_")) {
                    corretaStr = corretaStr.replace("alt_", "");
                }
                
                // 2. If it's a full text match, resolve to the correct option letter
                if (corretaStr.length > 1) {
                    const normalizeText = (txt) => {
                        if (!txt) return "";
                        return txt.trim().toLowerCase().replace(/^[a-e]\s*[-)]\s*/, "").trim();
                    };
                    
                    const normalizedCorreta = normalizeText(corretaStr);
                    const alternatives = ['a', 'b', 'c', 'd', 'e'];
                    for (const alt of alternatives) {
                        const altText = item[`ALT_${alt.toUpperCase()}`];
                        if (altText && normalizeText(altText) === normalizedCorreta) {
                            corretaStr = alt;
                            break;
                        }
                    }
                }
                
                return {
                    questao: item.QUESTAO,
                    alternativas: {
                        a: item.ALT_A,
                        b: item.ALT_B,
                        c: item.ALT_C,
                        d: item.ALT_D,
                        e: item.ALT_E
                    },
                    correta: corretaStr,
                    teoria: item.TEORIA,
                    aula: item.AULA
                };
            });
            
            console.log("Questões carregadas com sucesso:", questions.length);
            return true;
        } catch (error) {
            console.error(error);
            alert(`Erro ao carregar as questões da disciplina "${disciplina}".\nCertifique-se de que o arquivo "${jsonFile}" está presente na pasta do projeto.`);
            return false;
        } finally {
            loading.style.display = 'none';
        }
    }

    async function startQuiz() {
        const nome = document.getElementById('nome').value.trim();
        const ra = document.getElementById('ra').value.trim();
        const escola = document.getElementById('escola').value;
        const serie = document.getElementById('serie').value;
        const disciplina = document.getElementById('disciplina').value;
        const professor = document.getElementById('professor').value;

        if (!nome || !ra || !escola || !serie || !disciplina || !professor) {
            alert("Por favor, preencha todos os campos de identificação.");
            return;
        }

        // Carrega as questões da disciplina selecionada
        const success = await loadQuestions(disciplina);
        if (!success) {
            return;
        }

        if (questions.length === 0) {
            alert("Nenhuma questão disponível para esta disciplina.");
            return;
        }

        userData = { nome, ra, escola, serie, disciplina, professor };
        userAnswers = {}; // Limpa respostas anteriores
        
        // Inicializa q1 até q30 com vazio
        for (let i = 1; i <= 30; i++) {
            userAnswers[`q${i}`] = "";
        }

        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('quiz-engine').style.display = 'block';
        renderQuestion();
    }

    function renderQuestion() {
        const q = questions[currentQuestionIndex];
        attemptsOnCurrentQuestion = 0;
        
        const container = document.getElementById('question-container');
        let optionsHtml = '';
        
        for (let key in q.alternativas) {
            optionsHtml += `
                <li>
                    <label class="answer-label" id="label-${key}">
                        <input type="radio" name="quiz-opt" value="${key}">
                        <span>${key.toUpperCase()}) ${q.alternativas[key]}</span>
                    </label>
                </li>
            `;
        }

        container.innerHTML = `
            <div class="question-card">
                <p style="color: var(--accent); font-weight: 600; font-size: 0.9em; margin-bottom: 8px;">${q.aula}</p>
                <span class="question-text">${currentQuestionIndex + 1}. ${q.questao}</span>
                <ul class="answers">${optionsHtml}</ul>
                <div class="actions">
                    <button class="btn-check" id="btn-check" onclick="checkAnswer()">VERIFICAR RESPOSTA</button>
                    <button class="btn-next" id="btn-next" onclick="nextQuestion()">PRÓXIMA QUESTÃO</button>
                </div>
            </div>
        `;

        document.querySelectorAll('input[name="quiz-opt"]').forEach(input => {
            input.addEventListener('change', (e) => {
                document.querySelectorAll('.answer-label').forEach(l => l.classList.remove('selected'));
                document.getElementById(`label-${e.target.value}`).classList.add('selected');
            });
        });

        updateProgress();
    }

    function checkAnswer() {
        const selected = document.querySelector('input[name="quiz-opt"]:checked');
        if (!selected) {
            alert("Selecione uma alternativa!");
            return;
        }

        const q = questions[currentQuestionIndex];
        const selectedValue = selected.value;
        const isCorrect = selectedValue === q.correta;
        
        userAnswers[`q${currentQuestionIndex + 1}`] = selectedValue.toUpperCase();

        const modal = document.getElementById('feedbackModal');
        const statusEl = document.getElementById('modal-status');
        const theoryEl = document.getElementById('modal-theory');

        if (isCorrect) {
            statusEl.innerText = "⭐ PARABÉNS! ⭐";
            statusEl.className = "modal-status status-success";
            
            const pointsGained = attemptsOnCurrentQuestion === 0 ? 1 : 0.5;
            totalScore += pointsGained;
            
            document.getElementById('btn-check').style.display = 'none';
            document.getElementById('btn-next').style.display = 'block';
            document.querySelectorAll('input[name="quiz-opt"]').forEach(i => i.disabled = true);
            
            resetFeedbackButton();
        } else {
            statusEl.innerText = "❌ NÃO ESTÁ CORRETO ❌";
            statusEl.className = "modal-status status-error";
            attemptsOnCurrentQuestion++;
            
            startFeedbackTimer();
        }

        theoryEl.innerText = q.teoria;
        modal.style.display = 'flex';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            renderQuestion();
        } else {
            finishQuiz();
        }
    }

    function updateProgress() {
        const progress = (currentQuestionIndex / questions.length) * 100;
        document.getElementById('progress-fill').style.width = `${progress}%`;
    }

    function finishQuiz() {
        document.getElementById('quiz-engine').style.display = 'none';
        document.getElementById('success-screen').style.display = 'block';
        document.getElementById('final-score').innerText = totalScore.toFixed(1);
        document.getElementById('msg-sucesso').innerText = `Obrigado, ${userData.nome}! Clique no botão abaixo para enviar sua avaliação.`;
    }

    async function enviarDados() {
        const btn = document.getElementById('btn-enviar');
        btn.disabled = true;
        btn.innerText = "ENVIANDO...";

        const gabarito = {};
        questions.forEach((q, index) => {
            gabarito[`g${index + 1}`] = q.correta.toUpperCase();
        });

        const payload = {
            ...userData,
            acertos: totalScore.toFixed(1),
            ...userAnswers,
            ...gabarito,
            timestamp: new Date().toISOString()
        };

        try {
            const response = await fetch('https://webhook.inetz.com.br/webhook/avalia', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            if (response.ok) {
                btn.innerText = "AVALIAÇÃO ENVIADA COM SUCESSO!";
                btn.style.background = "var(--success)";
                document.getElementById('msg-sucesso').innerText = `Sua avaliação foi recebida pelo professor ${userData.professor}.`;
            } else {
                throw new Error('Erro ao enviar');
            }
        } catch (e) {
            console.error("Erro ao reportar nota final:", e);
            btn.innerText = "ERRO AO ENVIAR - TENTAR NOVAMENTE";
            btn.disabled = false;
        }
    }

    document.getElementById('btnCloseModal').onclick = () => {
        if (document.getElementById('btnCloseModal').disabled) return;
        document.getElementById('feedbackModal').style.display = 'none';
    };

    window.onclick = (e) => {
        if (e.target == document.getElementById('feedbackModal')) {
            const btnClose = document.getElementById('btnCloseModal');
            if (!btnClose.disabled) {
                document.getElementById('feedbackModal').style.display = 'none';
            }
        }
    };
</script>

</body>
</html>
