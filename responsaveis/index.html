<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Formulário de cadastro e vinculação de responsável do aluno - EE Antonio Reginato">
  <title>Cadastro de Responsável - EE Antonio Reginato</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="main-wrapper">
    <!-- Header -->
    <header class="header-card">
      <div id="envBadge" class="env-badge test">
        <i class="fa-solid fa-flask"></i> Ambiente: Teste
      </div>
      <h1>Cadastro de Responsável</h1>
      <div class="school-subtitle">
        <i class="fa-solid fa-graduation-cap"></i> Escola Estadual Antonio Reginato
      </div>
    </header>

    <!-- Main Form Card -->
    <main class="form-card">
      <!-- Alert Message Container -->
      <div id="alertContainer"></div>

      <form id="formResponsavel" novalidate>
        
        <!-- SEÇÃO 1: SELEÇÃO DO ALUNO -->
        <div class="section-title">
          <span class="step-number">1</span>
          <span>Seleção do Aluno</span>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="turmaSelect">
              <i class="fa-solid fa-users"></i> Turma/Série <span class="required-star">*</span>
            </label>
            <select id="turmaSelect" required>
              <option value="">-- Selecione a Turma --</option>
            </select>
          </div>

          <div class="form-group">
            <label for="alunoSelect">
              <i class="fa-solid fa-user-graduate"></i> Aluno <span class="required-star">*</span>
            </label>
            <select id="alunoSelect" disabled required>
              <option value="">-- Primeiro selecione a Turma --</option>
            </select>
          </div>
        </div>

        <!-- Student Selected Info Card -->
        <div id="studentInfoCard" class="student-info-card hidden">
          <div class="student-detail">
            <span id="studentNameDisplay" class="name">Nome do Aluno</span>
            <span id="studentSubDisplay" class="sub">RA: - | Escola: -</span>
          </div>
          <span id="studentTurmaBadge" class="student-badge">Turma -</span>
        </div>

        <!-- SEÇÃO 2: DADOS DO RESPONSÁVEL -->
        <div class="section-title" style="margin-top: 10px;">
          <span class="step-number">2</span>
          <span>Dados do Responsável</span>
        </div>

        <div class="form-grid">
          <div class="form-group full-width">
            <label for="nomeResponsavel">
              <i class="fa-solid fa-id-card"></i> Nome Completo do Responsável <span class="required-star">*</span>
            </label>
            <input 
              type="text" 
              id="nomeResponsavel" 
              placeholder="Ex: Maria da Silva" 
              required
            >
          </div>

          <div class="form-group">
            <label for="tipoResponsavel">
              <i class="fa-solid fa-people-roof"></i> Tipo / Parentesco <span class="required-star">*</span>
            </label>
            <select id="tipoResponsavel" required>
              <option value="" disabled selected>-- Selecione --</option>
              <option value="Mãe">Mãe</option>
              <option value="Pai">Pai</option>
              <option value="Avó">Avó</option>
              <option value="Avô">Avô</option>
              <option value="Tio">Tio</option>
              <option value="Outro">Outro</option>
            </select>
          </div>

          <div class="form-group">
            <label for="telefone">
              <i class="fa-solid fa-phone"></i> Telefone de Contato <span class="required-star">*</span>
            </label>
            <input 
              type="tel" 
              id="telefone" 
              placeholder="(00) 00000-0000" 
              required
            >
          </div>

          <div class="form-group full-width">
            <label class="toggle-wrapper" for="isWhatsapp">
              <div class="toggle-info">
                <i class="fa-brands fa-whatsapp"></i>
                <span>Este número é WhatsApp?</span>
              </div>
              <div class="toggle-switch">
                <input type="checkbox" id="isWhatsapp" checked>
                <span class="slider"></span>
              </div>
            </label>
          </div>

          <div class="form-group full-width">
            <label for="emailResponsavel">
              <i class="fa-solid fa-envelope"></i> E-mail do Responsável <span class="required-star">*</span>
            </label>
            <input 
              type="email" 
              id="emailResponsavel" 
              placeholder="exemplo@email.com" 
              required
            >
          </div>
        </div>

        <button type="submit" id="btnSubmit" class="btn-submit">
          <i class="fa-solid fa-paper-plane"></i> Cadastrar e Vincular Responsável
        </button>

      </form>
    </main>

    <footer>
      Escola Estadual Antonio Reginato &bull; Sistema de Responsáveis &bull; DevMaker
    </footer>
  </div>

  <script src="modelo.js"></script>
  <script src="script.js"></script>
</body>
</html>
